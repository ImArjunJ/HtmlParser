name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        platform:
          - {os: ubuntu-latest, compiler: g++}
          - {os: ubuntu-latest, compiler: clang++}
          - {os: macos-latest, compiler: clang++}
          - {os: windows-latest, compiler: cl}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.platform.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DHTMLPARSER_BUILD_TESTS=ON
          -DHTMLPARSER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4
      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DHTMLPARSER_ENABLE_SANITIZERS=ON -DHTMLPARSER_BUILD_EXAMPLES=OFF
      - name: Build and test
        run: |
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure --parallel 4
